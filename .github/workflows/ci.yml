name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 UCRT64 toolchain
        shell: pwsh
        run: |
          $pacman = "C:\msys64\usr\bin\pacman.exe"
          & $pacman -Sy --noconfirm --disable-download-timeout
          & $pacman -S --needed --noconfirm --disable-download-timeout `
            make `
            mingw-w64-ucrt-x86_64-gcc `
            mingw-w64-ucrt-x86_64-nasm `
            mingw-w64-ucrt-x86_64-meson `
            mingw-w64-ucrt-x86_64-ninja `
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath C:\zig -Force
          "C:\zig\zig-x86_64-windows-0.16.0" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build from source
        shell: pwsh
        run: zig build -Dprebuilt=false

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm meson ninja-build pkg-config curl \
            libva-dev libdrm-dev libssl-dev

      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Build from source
        run: zig build -Dprebuilt=false
