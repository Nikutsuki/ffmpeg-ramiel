name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 UCRT64 toolchain
        shell: pwsh
        run: |
          $pacman = "C:\msys64\usr\bin\pacman.exe"
          & $pacman -Sy --noconfirm --disable-download-timeout
          & $pacman -S --needed --noconfirm --disable-download-timeout `
            make `
            mingw-w64-ucrt-x86_64-gcc `
            mingw-w64-ucrt-x86_64-nasm `
            mingw-w64-ucrt-x86_64-meson `
            mingw-w64-ucrt-x86_64-ninja `
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath C:\zig -Force
          "C:\zig\zig-x86_64-windows-0.16.0" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build static FFmpeg + dav1d
        shell: pwsh
        run: zig build -Dprebuilt=false

      - name: Package
        shell: pwsh
        run: |
          Copy-Item NOTICE zig-out/ffmpeg/NOTICE
          Copy-Item COPYING.LGPLv2.1 zig-out/ffmpeg/COPYING.LGPLv2.1
          Copy-Item COPYING.dav1d zig-out/ffmpeg/COPYING.dav1d
          tar -czf "ffmpeg-ramiel-$env:GITHUB_REF_NAME-x86_64-windows.tar.gz" -C zig-out/ffmpeg .

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.tar.gz"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm meson ninja-build pkg-config curl \
            libva-dev libdrm-dev libssl-dev

      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Build static FFmpeg + dav1d
        run: zig build -Dprebuilt=false

      - name: Package
        run: |
          cp NOTICE zig-out/ffmpeg/NOTICE
          cp COPYING.LGPLv2.1 zig-out/ffmpeg/COPYING.LGPLv2.1
          cp COPYING.dav1d zig-out/ffmpeg/COPYING.dav1d
          tar -czf "ffmpeg-ramiel-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" -C zig-out/ffmpeg .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.tar.gz"

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Print zig package hashes
        run: |
          for f in dist/*.tar.gz; do
            echo "=== $f ==="
            sha256sum "$f"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

  # After the GitHub Release assets exist, compute Zig package hashes and commit
  # them to the default branch so `zig build` (prebuilt=true) fetches this tag.
  update-prebuilts:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Point build.zig.zon at this release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          WIN_TGZ="dist/ffmpeg-ramiel-${TAG}-x86_64-windows.tar.gz"
          LIN_TGZ="dist/ffmpeg-ramiel-${TAG}-x86_64-linux.tar.gz"
          test -f "$WIN_TGZ" && test -f "$LIN_TGZ"

          HASH_WIN="$(zig fetch "$(pwd)/$WIN_TGZ")"
          HASH_LIN="$(zig fetch "$(pwd)/$LIN_TGZ")"
          echo "windows hash: $HASH_WIN"
          echo "linux hash:   $HASH_LIN"

          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          URL_WIN="${BASE}/ffmpeg-ramiel-${TAG}-x86_64-windows.tar.gz"
          URL_LIN="${BASE}/ffmpeg-ramiel-${TAG}-x86_64-linux.tar.gz"

          python3 - "$VERSION" "$URL_WIN" "$HASH_WIN" "$URL_LIN" "$HASH_LIN" <<'PY'
          import pathlib, re, sys
          version, url_win, hash_win, url_lin, hash_lin = sys.argv[1:]
          path = pathlib.Path("build.zig.zon")
          text = path.read_text()
          text = re.sub(
              r'(\.version\s*=\s*")[^"]+(")',
              rf'\g<1>{version}\2',
              text,
              count=1,
          )
          text = re.sub(
              r'(\.prebuilt_x86_64_windows\s*=\s*\.\{\s*\n\s*\.url\s*=\s*")[^"]+("\s*,\s*\n\s*\.hash\s*=\s*")[^"]+(")',
              rf'\g<1>{url_win}\2{hash_win}\3',
              text,
              count=1,
          )
          text = re.sub(
              r'(\.prebuilt_x86_64_linux\s*=\s*\.\{\s*\n\s*\.url\s*=\s*")[^"]+("\s*,\s*\n\s*\.hash\s*=\s*")[^"]+(")',
              rf'\g<1>{url_lin}\2{hash_lin}\3',
              text,
              count=1,
          )
          path.write_text(text)
          print(path.read_text())
          PY

      - name: Commit and push zon update
        run: |
          set -euo pipefail
          if git diff --quiet -- build.zig.zon; then
            echo "build.zig.zon already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.zig.zon
          git commit -m "chore: pin ${{ github.ref_name }} prebuilt tarball hashes"
          git push
